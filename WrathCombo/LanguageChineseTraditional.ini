Paste a base64 encoded configuration here to load it into the plugin.\nThis comes from a debug file.\nThis will overwrite your current configuration temporarily, restoring your own configuration when you disable debug mode.\nDebug mode will also be disabled if you unload the plugin.==在此貼上 base64 編碼的設定以載入外掛。\n這通常來自除錯檔案。\n這會暫時覆蓋你目前的設定，停用除錯模式後會還原成你原本的設定。\n卸載外掛時除錯模式也會一併停用。
