Rotation Behavior Options==循環行為選項
Block spells if moving==移動時阻止詠唱
Completely blocks spells from being used if you are moving, by replacing your actions with Savage Blade.\nThis would supersede combo-specific movement options, available for most jobs.\n\nIt is recommended to keep this off, as most combos already handle this more gracefully.\nDefault: Off==移動時完全阻止施放詠唱技能,會將你的技能替換為狂怒劍。\n此選項會凌駕大多數職業連擊內建的移動選項。\n\n建議保持關閉,多數連擊已能更妥善地處理移動。\n預設:關閉
Action Replacing==技能替換
Controls whether Actions will be Intercepted Replaced with combos from the plugin.\nIf disabled, your manual presses of abilities will no longer be affected by your Wrath settings.\n\nAuto-Rotation will work regardless of the setting.\n\nControlled by the `/wrath combo` command.\n\nIt is REQUIRED to keep this on if you use want to use Wrath without Auto Rotation.\nDefault: On==控制技能是否會被插件攔截並替換為連擊。\n若停用,你手動按下的技能將不再受 Wrath 設定影響。\n\n無論此設定為何,自動循環都能正常運作。\n\n可透過 `/wrath combo` 指令控制。\n\n若你想在不使用自動循環的情況下使用 Wrath,必須保持開啟。\n預設:開啟
Performance Mode==效能模式
This mode will disable actions being changed on your hotbar, but will still continue to work in the background as you press your buttons.\n\nIt is recommended to try turing this on if you have performance issues.\nDefault: Off==此模式會停用熱鍵列上的技能圖示替換,但按下按鈕時仍會在背景照常運作。\n\n若你有效能問題,建議嘗試開啟。\n預設:關閉
Queued Action Suppression==佇列技能抑制
While Enabled:\nWhenever you queue an action that is not the same as the button you are pressing, Wrath will disable every other Combo, preventing them from thinking the queued action should trigger them.\n- This prevents combos from conflicting with each other, just because of overlap in actions that combos return and actions that combos replace.\n- This does however cause the Replaced Action for each combo to 'flash' through as actions are queued.\nThat 'flashed' action won't go through, it is only visual.\n\nWhile Disabled:\nCombos will not be disabled when actions are queued from a combo.\n- This prevents your hotbars 'flashing', that is the only benefit.\n- This does however allow Combos to conflict with each other, if one combo returns an action that another combo has as its Replaced Action.\nWe do NOT mark these types of conflicts, and we do NOT try to avoid them as we add new features.\n\nIt is STRONGLY recommended to keep this setting On.\nIf the 'flashing' bothers you it is MUCH more advised to use Performance Mode,\ninstead of turning this off.\nDefault: On==啟用時:\n每當你排入佇列的技能與目前按下的按鈕不同時,Wrath 會停用所有其他連擊,防止它們誤以為佇列中的技能應該觸發自己。\n- 這可以避免連擊之間僅因「連擊輸出的技能」與「連擊替換的技能」重疊而互相衝突。\n- 但這會使每個連擊的被替換技能在技能排入佇列時於熱鍵列上「閃爍」。\n「閃爍」的技能不會真的施放,僅是視覺效果。\n\n停用時:\n由連擊排入佇列的技能不會停用其他連擊。\n- 可避免熱鍵列「閃爍」,這是唯一的好處。\n- 但若某個連擊輸出的技能剛好是另一個連擊的被替換技能,連擊之間就可能互相衝突。\n我們不會標示這類衝突,新增功能時也不會刻意避免。\n\n強烈建議保持此設定開啟。\n若「閃爍」困擾你,更建議改用效能模式,\n而不是關閉此選項。\n預設:開啟
read more:==深入瞭解:
milliseconds==毫秒
seconds==秒
yalms==米
%% of cast==詠唱百分比
oGCDs==個能力技
   -   Action Updater Throttle==   -   技能更新頻率限制
   -   Movement Check Delay==   -   移動判定延遲
Many features check if you are moving to decide actions, this will allow you to set a delay on how long you need to be moving before it recognizes you as moving.\nThis allows you to not have to worry about small movements affecting your rotation, primarily for casters.\n\nIt is recommended to keep this value between 0 and 1 seconds.\nDefault: 0.0==許多功能會依你是否正在移動來決定技能,此設定可讓你設定一個延遲,需持續移動達該時間後才會被視為移動中。\n如此便不必擔心小幅移動影響你的循環,主要適用於施法職業。\n\n建議將此值保持在 0 到 1 秒之間。\n預設值:0.0
   -   Opener Failure Timeout==   -   起手失敗逾時
During an opener if this amount of time has passed since your last action, it will fail the opener and resume with non-opener functionality.\n\nIt is recommended to keep this value below 6.\nDefault: 4.0==在起手期間,若距離你上一個技能已超過此時間,將判定起手失敗,並改以非起手邏輯繼續循環。\n\n建議將此值保持在 6 以下。\n預設值:4.0
   -   Melee Distance Offset==   -   近戰距離偏移
Offset of melee check distance.\nFor those who don't want to immediately use their ranged attack if the boss walks slightly out of range.\n\nFor example, a value of -0.5 would make you have to be 0.5 yalms closer to the target,\nor a value of 2 would disable triggering of ranged features until you are 2 yalms further from the hitbox.\n\nIt is recommended to keep this value at 0.\nDefault: 0.0==近戰距離判定的偏移值。\n適合不希望 Boss 稍微走出範圍就立刻改用遠程攻擊的玩家。\n\n例如:設為 -0.5 時,你必須比原本再靠近目標 0.5 米;\n設為 2 時,要距離目標碰撞判定 2 米以上才會觸發遠程功能。\n\n建議保持為 0。\n預設值:0.0
   -   Interrupt Delay==   -   打斷延遲
The percentage of a total cast time to wait before interrupting.\nApplies to all interrupts, in every job's combos.\n\nIt is recommend to keep this value below 50%.\nDefault: 0%==等待多少百分比的總詠唱時間後才進行打斷。\n適用於所有職業連擊中的所有打斷技能。\n\n建議將此值保持在 50% 以下。\n預設值:0%
   -   Maximum number of Weaves==   -   最大插入數量
This controls how many oGCDs are allowed between GCDs.\nThe sort of 'default' for the game is double weaving, but triple weaving is completely possible to do with low enough latency (of every kind); but if you struggle with latency of some sort, single weaving may even be a good answer for you.\nTriple weaving is already done in a manner where we try to avoid clipping GCDs, and as such doesn't happen particularly often even if you do have good latency, so it is a safe option as far as parses/etc goes.\n\nDefault: 2==控制每個 GCD 之間允許插入多少個能力技(oGCD)。\n遊戲的「預設」情況是雙插,但只要各方面的延遲夠低,三插也完全可行;若你的延遲較高,單插也許更適合你。\n三插的實作方式會盡量避免卡 GCD,因此即使延遲良好也不會太常發生,就輸出統計而言是安全的選項。\n\n預設值:2
Targeting Options==目標選擇選項
Retarget (Single Target) Healing Actions==重定向(單體)治療技能
This will retarget all single target healing actions to the Heal Stack as shown below,\nsimilarly to how Redirect or Reaction would.\nThis ensures that the target used to check HP% threshold logic for healing actions is the same target that will receive that heal.\n\nIt is recommended to enable this if you customize the Heal Stack at all.\nDefault: Off==這會將所有單體治療技能重定向至下方顯示的治療目標堆疊,\n類似 Redirect 或 Reaction 的做法。\n如此可確保用於檢查治療技能 HP% 閾值的目標,與實際接受治療的目標一致。\n\n若你有自訂治療目標堆疊,建議啟用此選項。\n預設:關閉
Add Out of Party NPCs to Retargeting==將小隊外的 NPC 納入重定向
