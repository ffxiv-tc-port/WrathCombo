Select this if you would rather make your own stack of target priorities for Heal Targets instead of using our default stack.\n\nIt is recommended to use this to align with your Redirect/Reaction configuration if you're not using the Retarget Healing Actions setup; otherwise it is preference.\nDefault: Off==若你想自行安排治療目標的優先順序,而非使用預設堆疊,請勾選此項。\n\n若未使用「重定向治療技能」方案,建議配合你的 Redirect/Reaction 設定來調整;否則依個人喜好即可。\n預設:關閉
