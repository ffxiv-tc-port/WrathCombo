If you see the ID constantly changing, that's a sign that the Retarget is constantly being Partially Overwritten.\n\nThis occurs when two different Retargets keep being registered, which do not fully overwrite each other (they do not share the same Replaced Actions).\nUsually this is when you have a retargeting of an action in Feature and also in a Main Combo, and is a sign that both/all the Retargets will likely work.==若你看到 ID 一直在變動，代表此重定向持續被部分覆寫。\n\n這發生於兩個不同的重定向不斷被註冊，卻沒有完全覆蓋彼此（它們的被替換技能不完全相同）。\n通常是同一個技能同時在某個功能與某個主要連擊中都設有重定向，這代表兩者（或全部）的重定向都很可能生效。
Replaced Actions:==被替換技能：
Resolvers may only resolve to a fallback target,\nexcept under conditions where the Retargeting would actually be applied.==解析器通常只會解析出備援目標，\n除非符合重定向實際套用的條件。
