By default, the Server Info Bar for Wrath Combo shows whether Auto-Rotation is on or off, \nthen -if on- it will show how many active Auto-Mode combos you have enabled. \nAnd finally, it will also show if another plugin is controlling that value.\nThis option will make the number of active Auto-Mode combos not show==預設情況下,Wrath Combo 的伺服器資訊列會顯示自動循環的開關狀態,\n開啟時還會顯示已啟用的自動模式連擊數量,\n最後也會顯示是否有其他插件正在控制該狀態。\n啟用此選項後將不再顯示已啟用的自動模式連擊數量
When you open Wrath with `/wrath`, it will open to the PvE Features tab, instead of the last tab you were on.\nSame as always using the `/wrath pve` command to open Wrath.==當你使用 `/wrath` 開啟 Wrath 時,將固定開啟 PvE 功能分頁,而不是上次停留的分頁。\n等同於每次都使用 `/wrath pve` 指令開啟 Wrath。
Same as above, when you open Wrath with `/wrath`, it will open to the PvP Features tab, instead of the last tab you were on, when in a PvP area.\nSimilar to using the `/wrath pvp` command to open Wrath.==同上,當你在 PvP 區域使用 `/wrath` 開啟 Wrath 時,將固定開啟 PvP 功能分頁,而不是上次停留的分頁。\n類似於使用 `/wrath pvp` 指令開啟 Wrath。
With this enabled, whenever you queue an action that is not the same as the button you are pressing, it will disable every other button's feature from running. This resolves a number of issues where incorrect actions are performed due to how the game processes queued actions, however the visual experience on your hotbars is degraded. This is not recommended to be disabled, however if you feel uncomfortable with hotbar icons changing quickly this is one way to resolve it (or use Performance Mode) but be aware that this may introduce unintended side effects to combos if you have a lot enabled for a job.\n\nFor a more complicated explanation, whenever an action is used, the following happens:\n1. If the action invokes the GCD (Weaponskills & Spells), if the GCD currently isn't active it will use it right away.\n2. Otherwise, if you're within the "Queue Window" (normally the last 0.5s of the GCD), it gets added to the queue before it is used.\n3. If the action is an Ability, as long as there's no animation lock currently happening it will execute right away.\n4. Otherwise, it is added to the queue immediately and then used when the animation lock is finished.\n\nFor step 1, the action being passed to the game is the original, unmodified action, which is then converted at use time. At step 2, things get messy as the queued action still remains the unmodified action, but when the queue is executed it treats it as if the modified action *is* the unmodified action.\n\nE.g. Original action Cure, modified action Cure II. At step 1, the game is okay to convert Cure to Cure II because that is what we're telling it to do. However, when Cure is passed to the queue, it treats it as if the unmodified action is Cure II.\n\nThis is similar for steps 3 & 4, except it can just happen earlier.\n\nHow this impacts us is if using the example before, we have a feature replacing Cure with Cure II, and another replacing Cure II with Regen and you enable both, the following happens:\n\nStep 1, Cure is passed to the game, is converted to Cure II.\nYou press Cure again at the Queue Window, Cure is passed to the queue, however the queue when it goes to execute will treat it as Cure II.\nResult is instead of Cure II being executed, it's Regen, because we've told it to modify Cure II to Regen.\nThis was not part of the first feature, therefore an incorrect action.\n\nOur workaround for this is to disable all other actions being replaced if they don't match the queued action, which this setting controls.==啟用後,每當你排入佇列的技能與目前按下的按鈕不同時,會停用所有其他按鈕的功能。這解決了許多因遊戲處理技能佇列的方式而執行錯誤技能的問題,但會犧牲熱鍵列的視覺體驗。不建議停用此選項;若你不喜歡熱鍵列圖示快速變動,這是一種解決方式(或改用效能模式),但請注意,若你為同一職業啟用了大量連擊,可能會對連擊造成非預期的副作用。\n\n更詳細的解釋:每當使用技能時,流程如下:\n1. 若技能會觸發 GCD(戰技與魔法),且 GCD 目前未在轉動,則會立即使用。\n2. 否則,若處於「佇列窗口」(通常是 GCD 的最後 0.5 秒),技能會在使用前先加入佇列。\n3. 若技能是能力技,只要目前沒有動畫鎖定,就會立即執行。\n4. 否則,會立即加入佇列,並在動畫鎖定結束後使用。\n\n在第 1 步,傳給遊戲的是原始、未經替換的技能,使用當下才會被轉換。到第 2 步就變得棘手:佇列中的技能仍是未替換的原始技能,但佇列執行時卻會把替換後的技能「當成」原始技能。\n\n例如:原始技能為療傷,替換後為中療傷。在第 1 步,遊戲會把療傷轉換成中療傷,因為這正是我們要求的。然而當療傷被送入佇列時,佇列會把中療傷當成未替換的技能。\n\n第 3、4 步的情況類似,只是可能更早發生。\n\n這對我們的影響是:延續前面的例子,若有一個功能把療傷替換成中療傷,另一個功能把中療傷替換成再生,且兩者都啟用,流程如下:\n\n第 1 步,療傷傳給遊戲,被轉換成中療傷。\n你在佇列窗口再次按下療傷,療傷被送入佇列,但佇列執行時會把它當成中療傷。\n結果施放的不是中療傷,而是再生,因為我們設定了把中療傷替換成再生。\n這不是第一個功能的本意,因此是錯誤的技能。\n\n我們的解決方法是:停用所有與佇列技能不符的技能替換,此設定即控制這個行為。
This is the restriction for how often combos will update the action on your hotbar.\nBy default this isn't restricting the combos, so you always get an up-to-date action.\n\nIf you have minor FPS issues, you can increase this value to make combos run less often.\nThis makes your combos less responsive, and perhaps even clips GCDs.\nAt high values, this can break your rotation entirely.\nMore severe FPS issues should instead be handled with Performance Mode option above.\n\n200ms can make a reasonable difference in your FPS.\nValues over 500ms are NOT recommended.\nDefault: 50==此設定限制連擊多久更新一次熱鍵列上的技能。\n預設不做任何限制,因此技能永遠保持最新狀態。\n\n若你有輕微的 FPS 問題,可以調高此值,讓連擊更新得少一些。\n這會讓連擊的反應變慢,甚至可能卡 GCD。\n數值過高時,可能會完全破壞你的循環。\n較嚴重的 FPS 問題請改用上方的效能模式。\n\n200 毫秒即可對 FPS 產生可觀的改善。\n不建議超過 500 毫秒。\n預設值:50
This will add any NPCs that are not in your party to the retargeting logic for healing actions.\n\nThis is useful for healers who want to be able to target NPCs that are not in their party, such as quest NPCs.\n\nThese NPCs will not work with any role based custom stacks (even if an NPC looks like a tank, they're not classed as one)\n\nDefault: Off==這會將不在你小隊中的 NPC 納入治療技能的重定向邏輯。\n\n對想治療小隊外 NPC(例如任務 NPC)的治療職業很有用。\n\n這些 NPC 不適用任何以職能為基礎的自訂堆疊(即使 NPC 看起來像坦克,也不會被視為坦克)\n\n預設:關閉
This is the order in which Wrath will try to select a healing target.\n\nIf the 'Retarget Healing Actions' option is disabled, that is just the target that will be used for checking the HP threshold to trigger different healing actions to show up in their rotations.\nIf the 'Retarget Healing Actions' option is enabled, that target is also the one that healing actions will be targeted onto (even when the action does not first check the HP of that target, like the combo's Replaced Action, for example).==這是 Wrath 選擇治療目標的優先順序。\n\n若未啟用「重定向治療技能」選項,此目標僅用於檢查 HP 閾值,以決定循環中出現哪些治療技能。\n若啟用「重定向治療技能」選項,治療技能也會實際施放在該目標身上(即使該技能原本不會先檢查該目標的 HP,例如連擊的被替換技能)。
The priority goes from top to bottom.\nScroll down to see all of your items.\nClick the Up and Down buttons to move items in the list.\nClick the X button to remove an item from the list.\n\nIf there are fewer than 4 items, and all return nothing when checked, will fall back to Self.\n\nThese targets will only be considered valid if they are friendly and within 25y.\nThese targets will be checked for being Dead or having a Cleansable Debuff\nwhen this Stack is applied to Raises or Esuna, respectively.\n(For Raises: the Stack will fall back to your Hard Target or any Dead Party Member)\n\nDefault: Focus Target > Hard Target > Self==優先順序由上到下。\n向下捲動可查看所有項目。\n點擊上下按鈕可調整項目順序。\n點擊 X 按鈕可將項目移出清單。\n\n若項目少於 4 個且全部無效,將回退為自己。\n\n這些目標必須為友方且在 25 米內才視為有效。\n當此堆疊套用於復活或復原時,會分別檢查目標是否死亡或帶有可驅散的減益。\n(復活時:堆疊會回退為你的硬鎖定目標或任一死亡的小隊成員)\n\n預設:焦點目標 > 硬鎖定目標 > 自己
This is the order in which Wrath will try to select a target to Raise,\nif Retargeting of any Raise Feature is enabled.\n\nYou can find Raise Features under PvE>General,\nor under each caster that has a Raise.==這是啟用任一復活重定向功能時,\nWrath 選擇復活目標的優先順序。\n\n復活功能位於 PvE>General,\n或各個擁有復活技能的施法職業頁面中。
The priority goes from top to bottom.\nScroll down to see all of your items.\nClick the Up and Down buttons to move items in the list.\nClick the X button to remove an item from the list.\n\nIf there are fewer than 5 items, and all return nothing when checked, will fall back to:\nyour Hard Target if they're dead, or <Any Dead Party Member>.\n\nThese targets will only be considered valid if they are friendly, dead, and within 30y.\nDefault: Any Healer > Any Tank > Any Raiser > Any Dead Party Member==優先順序由上到下。\n向下捲動可查看所有項目。\n點擊上下按鈕可調整項目順序。\n點擊 X 按鈕可將項目移出清單。\n\n若項目少於 5 個且全部無效,將回退為:\n你的硬鎖定目標(若已死亡),或<任一死亡的小隊成員>。\n\n這些目標必須為友方、已死亡且在 30 米內才視為有效。\n預設:任一治療 > 任一坦克 > 任一持復活技能者 > 任一死亡的小隊成員
