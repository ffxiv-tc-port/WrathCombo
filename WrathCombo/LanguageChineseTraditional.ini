This will add any UI MouseOver targets to the top of the Default Heal Stack, overriding the rest of the stack if you are mousing over any party member UI.\n\nIt is recommended to enable this if you are a keyboard+mouse user and enable Retarget Healing Actions (or have UI MouseOver targets in your Redirect/Reaction configuration).\nDefault: Off==這會將 UI 滑鼠懸停目標(例如懸停在小隊列表上)加入預設治療堆疊的最頂端,當滑鼠懸停在任何隊伍成員 UI 上時,優先於堆疊中的其他目標。\n\n若你是鍵盤滑鼠使用者且啟用了「重定向治療技能」(或你的 Redirect/Reaction 設定中有 UI 滑鼠懸停目標),建議啟用。\n預設:關閉
Add Field MouseOver to the Default Healing Stack==將場景滑鼠懸停目標加入預設治療堆疊
This will add any MouseOver targets to the top of the Default Heal Stack, overriding the rest of the stack if you are mousing over any nameplate UI or character model.\n\nIt is recommended to enable this only if you regularly intentionally use field mouseover targeting already.\nDefault: Off==這會將場景滑鼠懸停目標(例如懸停在名牌或角色模型上)加入預設治療堆疊的最頂端,優先於堆疊中的其他目標。\n\n僅建議已經常刻意使用場景滑鼠懸停選取目標的玩家啟用。\n預設:關閉
Add Focus Target to the Default Healing Stack==將焦點目標加入預設治療堆疊
This will add your focus target under your hard and soft targets in the Default Heal Stack, overriding the rest of the stack if you have a living focus target.\n\nDefault: Off==這會將你的焦點目標插入預設治療堆疊中硬鎖定與軟鎖定目標之後,當焦點目標存活時,優先於堆疊中的其餘目標。\n\n預設:關閉
Add Lowest HP% Ally to the Default Healing Stack==將 HP% 最低的隊友加入預設治療堆疊
This will add a nearby party member with the lowest HP% to bottom of the Default Heal Stack, overriding only yourself.\n\nTHIS SHOULD BE USED WITH THE 'RETARGET HEALING ACTIONS' SETTING!\n\nDefault: Off==這會將附近 HP% 最低的小隊成員加入預設治療堆疊的底部,僅優先於自己。\n\n請務必搭配「重定向治療技能」設定使用!\n\n預設:關閉
This should be used with the 'Retarget Healing Actions' setting above!==此選項應搭配上方的「重定向治療技能」設定使用!
Or==或
