Mechanic-Aware Interrupt & Stun Targeting==機制感知的打斷／眩暈目標選擇
When picking a target to Interrupt or Stun, prefer the enemies that BossMod (Reborn) has flagged as the ones that actually need it for the current mechanic.\n\nWithout this, Wrath interrupts anything that reports an interruptible cast, and stuns anything that is not a boss - which wastes cooldowns on casts that do not matter.\n\nThe flags are only used to re-order the candidates Wrath already accepted; every existing check (hostile, targetable, in range, interruptible, stun immunity tracking) still applies.\nIf BossMod (Reborn) is not installed, or it has nothing flagged right now, this behaves exactly like it is off.\n\nDefault: Off==挑選打斷／眩暈的目標時，優先選 BossMod(Reborn) 標記為「這一發真的該處理」的敵人。\n\n不開這個選項時，Wrath 只要看到可打斷的詠唱就打斷、只要不是首領就嘗試眩暈，冷卻常常浪費在不重要的詠唱上。\n\n標記只用來把候選重新排序，Wrath 既有的每一道檢查（敵對、可選取、距離、可打斷、眩暈遞減追蹤）通通照舊。\n沒安裝 BossMod(Reborn)、或它目前沒有標記任何東西時，行為與關閉時完全相同。\n\n預設：關閉
Only act on flagged targets==只對被標記的目標出手
Stricter: instead of merely preferring the flagged enemies, only flagged enemies are considered at all.\n\nThis REDUCES how often you interrupt and stun. If BossMod (Reborn) is missing, or has nothing flagged, no target is picked and nothing is used.\nA one-off note is written to the log (Information level) while this is on and no flags can be read, so a silent 'the feature stopped working' can be told apart from 'there was nothing to interrupt'.\n\nDefault: Off==更嚴格：不只是把標記過的敵人排前面，而是只有被標記的敵人才算候選。\n\n這會讓你打斷與眩暈的次數變少。沒安裝 BossMod(Reborn)、或它目前沒有標記任何東西時，就選不到目標，也就完全不出手。\n開著這個選項而又讀不到任何標記時，記錄檔會留下一則 Information 等級的提示，讓「功能悄悄不動」和「本來就沒東西該打斷」分得出來。\n\n預設：關閉
Skip Stun-Immune Enemies (MonsterDex)==略過免疫眩暈的敵人（MonsterDex）
Ask MonsterDex whether the enemy can be stunned at all, and skip it when the answer is a definite no.\n\nOnly a definite 'not stunnable' excludes an enemy. MonsterDex not installed, no entry for that enemy, or any failed lookup all count as 'unknown', and unknown always passes - so this can never silently disable your stuns.\n\nDefault: Off==向 MonsterDex 查詢這隻敵人到底吃不吃眩暈，只有在明確得到「不吃」時才跳過它。\n\n只有明確的「無法眩暈」才會排除。沒安裝 MonsterDex、查不到這隻怪、或任何查詢失敗都算「不知道」，而「不知道」一律放行——所以這個選項不會把你的眩暈靜默關掉。\n\n預設：關閉
