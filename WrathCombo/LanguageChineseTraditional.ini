This is where you can configure the parameters in which Auto-Rotation will operate. Features marked with an 'Auto-Mode' checkbox are able to be used with Auto-Rotation.==你可以在此設定自動循環的運作參數。標有「自動模式」核取方塊的功能皆可用於自動循環。
Manual - Leaves all targeting decisions to you.\nHighest Max - Prioritises enemies with the highest max HP.\nLowest Max - Prioritises enemies with the lowest max HP.\nHighest Current - Prioritises the enemy with the highest current HP.\nLowest Current - Prioritises the enemy with the lowest current HP.\nTank Target - Prioritises the same target as the first tank in your group.\nNearest - Prioritises the closest target to you.\nFurthest - Prioritises the furthest target from you.\nManual Non-Player - Your manually selected target, only if it is a non-player target within 25 yalms.==手動 - 所有目標選擇皆由你決定。\n最高最大生命 - 優先選擇最大生命值最高的敵人。\n最低最大生命 - 優先選擇最大生命值最低的敵人。\n最高當前生命 - 優先選擇當前生命值最高的敵人。\n最低當前生命 - 優先選擇當前生命值最低的敵人。\n坦克目標 - 優先選擇與小隊中第一位坦克相同的目標。\n最近 - 優先選擇離你最近的目標。\n最遠 - 優先選擇離你最遠的目標。\n手動(非玩家) - 你手動選擇的目標,僅限 25 米內的非玩家目標。
These NPCs will be ignored by Auto-Rotation.\nEvery instance of this NPC will be excluded from automatic targeting (Manual will still work).\nTo remove an NPC from this list, select it and press the Delete button below.\nTo add an NPC to this list, target the NPC and use the command: /wrath ignore==這些 NPC 會被自動循環忽略。\n這種 NPC 的所有個體都會被排除在自動選擇目標之外(手動模式仍然有效)。\n要從清單中移除 NPC,請選取它並按下方的移除按鈕。\n要將 NPC 加入清單,請選取該 NPC 並使用指令:/wrath ignore
Manual - Will only heal a target if you select them manually. If the target does not meet the healing threshold settings criteria below it will skip healing in favour of DPSing (if also enabled).\nHighest Current - Prioritises the party member with the highest current HP%.\nLowest Current - Prioritises the party member with the lowest current HP%.==手動 - 只會治療你手動選擇的目標。若目標不符合下方治療閾值條件,將跳過治療,優先進行輸出(若也有啟用)。\n最高當前生命 - 優先選擇當前 HP% 最高的小隊成員。\n最低當前生命 - 優先選擇當前 HP% 最低的小隊成員。
