name: Release

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_TOKEN }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.x.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Download Dalamud (pinned TC-compatible build)
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\xivlauncher\Addon\Hooks\dev\"
      - name: Compute version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v'
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build
        run: dotnet build --no-restore --configuration Release --nologo -p:Version=${{ env.VER }} -p:FileVersion=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }}
      - name: write version into manifest
        shell: pwsh
        run: |
          $path = './WrathCombo/bin/Release/WrathCombo.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Archive
        run: Compress-Archive -Path WrathCombo/bin/Release/* -DestinationPath WrathCombo.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            WrathCombo.zip
            WrathCombo/bin/Release/WrathCombo.json
          generate_release_notes: true
